name: pharmapath_app
description: "PharmaPath — বাংলাদেশি ওষুধের তথ্য ও শেখার অফলাইন-ফার্স্ট অ্যাপ।"
publish_to: 'none'
version: 2.0.4+6

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  http: ^1.5.0
  get_storage: ^2.1.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  flutter_widget_from_html_core: ^0.16.0
  url_launcher: ^6.3.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^11.2.0
  sqlite3_flutter_libs: ^0.6.0+eol
  archive: ^4.5.2
  file_picker: ^13.2.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.4.0
  connectivity_plus: ^6.1.4
  # Image loading and caching
  cached_network_image: ^3.2.3
  # Charts for progress visualization
  fl_chart: ^0.70.0
  # Material Design 3 components
  material_color_utilities: ^0.13.0
  record: ^7.1.2
  ai_doctor_module:
    path: ai_doctor_module
  package_info_plus: 10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true
  assets:
    - assets/learning/
    - assets/companies/
    - assets/LOGO.jpg
  fonts:
    - family: Anek Bangla
      fonts:
        - asset: assets/fonts/AnekBangla-Thin.ttf
          weight: 100
        - asset: assets/fonts/AnekBangla-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/AnekBangla-Light.ttf
          weight: 300
        - asset: assets/fonts/AnekBangla-Regular.ttf
          weight: 400
        - asset: assets/fonts/AnekBangla-Medium.ttf
          weight: 500
        - asset: assets/fonts/AnekBangla-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/AnekBangla-Bold.ttf
          weight: 700
        - asset: assets/fonts/AnekBangla-ExtraBold.ttf
          weight: 800
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali.ttf

flutter_launcher_icons:
  image_path: "assets/LOGO.jpg"
  android: true
  ios: true
  min_sdk_android: 21

dependency_overrides:
  # path_provider_android 2.3.x uses JNI and fails during GetStorage startup
  # on this Flutter/Android plugin setup. Keep the compatible channel plugin.
  path_provider_android: 2.2.19
