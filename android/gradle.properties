org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler stores source paths relative to the project dir.
# The project lives on K: while the Pub cache lives on C:; Windows cannot compute
# a relative path across drives, which breaks plugin compilation with
# "this and base files have different roots". Disable incremental Kotlin
# compilation as a workaround (slower builds, but reliable).
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
