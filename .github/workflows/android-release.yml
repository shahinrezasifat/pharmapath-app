name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Configure release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/pharmapath-release.keystore
            printf '%s\n' "$ANDROID_KEY_PROPERTIES" | sed 's|storeFile=.*|storeFile=pharmapath-release.keystore|' > android/key.properties
          fi
      - name: Build universal Android APK
        run: >-
          flutter build apk --release
          --dart-define=GITHUB_REPOSITORY_OWNER=${{ github.repository_owner }}
          --dart-define=GITHUB_REPOSITORY_NAME=${{ github.event.repository.name }}
      - name: Prepare release notes
        shell: bash
        run: |
          mkdir -p dist/release
          cp build/app/outputs/flutter-apk/app-release.apk dist/release/PharmaPath-${GITHUB_REF_NAME}.apk
          gh release view "${GITHUB_REF_NAME}" --json body --jq .body > dist/release/RELEASE_NOTES.md 2>/dev/null || true
          if [ ! -s dist/release/RELEASE_NOTES.md ]; then
            git log -5 --pretty=format:'- %s' "$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || git rev-list --max-parents=0 HEAD)".."${GITHUB_REF_NAME}" > dist/release/RELEASE_NOTES.md
          fi
          printf '\n\n## Installation\nDownload the APK and install it on Android. The same application ID and signing key are required to update an existing installation.\n' >> dist/release/RELEASE_NOTES.md
      - name: Capture app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install build/app/outputs/flutter-apk/app-release.apk
            adb shell monkey -p com.pharmapath.pharmapath_app 1
            sleep 15
            mkdir -p dist/release/screenshots
            adb exec-out screencap -p > dist/release/screenshots/home.png
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/release/PharmaPath-${GITHUB_REF_NAME}.apk dist/release/screenshots/home.png --title "PharmaPath ${GITHUB_REF_NAME}" --notes-file dist/release/RELEASE_NOTES.md --target "${GITHUB_SHA}"
